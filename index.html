<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harfler Ses Rehberi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .player-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .error {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2 id="harf-alani">YÜKLENİYOR...</h2>
        <div id="player-area">
            <audio id="audio-player" controls>
                Tarayıcınız ses öğesini desteklemiyor.
            </audio>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // URL'deki "harf" parametresini alıyoruz (Örn: ?harf=a)
            const urlParams = new URLSearchParams(window.location.search);
            let harfId = urlParams.get('harf');
            
            const harfElement = document.getElementById('harf-alani');
            const playerElement = document.getElementById('audio-player');

            // Türkçe karakter desteğiyle birlikte harf kontrolü
            if (harfId && /^[a-zA-ZçÇğĞıİöÖşŞüÜ]+$/.test(harfId)) {
                harfId = harfId.trim().toLowerCase(); // Küçük harfe çeviriyoruz
                
                // Ekranda büyük harfle "A HARFİ" yazar
                harfElement.textContent = harfId.toUpperCase() + " HARFİ"; 

                // Dosya adını dinamik olarak "a_harfi.mp4" şeklinde oluşturur
                playerElement.src = harfId + '_harfi.mp4';
                playerElement.load();
            } else {
                harfElement.innerHTML = "<span class='error'>GEÇERSİZ QR KOD!</span>";
                playerElement.style.display = 'none';
            }
        });
    </script>
</body>
</html>
